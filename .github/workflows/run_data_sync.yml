name: Sync Running Data from Keep

on:
  # 每天 UTC 00:00 自动运行（北京时间 08:00）
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUN_TYPE: keep
      ATHLETE: WuLeiYuan
      TITLE: WuLeiYuan Running
      MIN_GRID_DISTANCE: 10
      TITLE_GRID: Over 10km Runs
      GITHUB_NAME: wuleiyuan
      GITHUB_EMAIL: smile_wly@163.com
      KEEP_PHONE_NUMBER: ${{ secrets.KEEP_PHONE_NUMBER }}
      KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔁 Sync data from Keep
        run: |
          echo "=== Running Keep sync ==="
          python -u scripts/keep_sync.py \
            "${{ secrets.KEEP_PHONE_NUMBER }}" \
            "${{ secrets.KEEP_PASSWORD }}" \
            2>&1 || true

      - name: 🖼️ Generate SVGs
        run: |
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE }}" --type github --athlete "${{ env.ATHLETE }}" --output assets/github.svg
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE_GRID }}" --type grid --athlete "${{ env.ATHLETE }}" --output assets/grid.svg --min-distance ${{ env.MIN_GRID_DISTANCE }}

      - name: 💾 Commit and push (safe mode)
        run: |
          git config user.name "${{ env.GITHUB_NAME }}"
          git config user.email "${{ env.GITHUB_EMAIL }}"
          # 安静添加文件，即使不存在也不报错
          git add activities.json gpx/ assets/ 2>/dev/null || true
          # 仅当有更改时才提交
          if ! git diff --staged --quiet; then
            git commit -m "chore: update running data from Keep"
            git push
            echo "✅ Successfully pushed new running data."
          else
            echo "ℹ️ No changes detected. Nothing to commit."
          fi
