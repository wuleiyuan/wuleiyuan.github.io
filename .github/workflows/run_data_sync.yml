name: Sync Running Data from Strava

on:
  # 每天 UTC 时间 00:00 自动运行（北京时间早上 8 点）
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      RUN_TYPE: strava
      ATHLETE: WuLeiYuan
      TITLE: WuLeiYuan Running
      MIN_GRID_DISTANCE: 10
      TITLE_GRID: Over 10km Runs
      GITHUB_NAME: wuleiyuan
      GITHUB_EMAIL: smile_wly@163.com

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔁 Sync data from Strava
        run: |
          python scripts/strava_sync.py \
            ${{ secrets.STRAVA_CLIENT_ID }} \
            ${{ secrets.STRAVA_CLIENT_SECRET }} \
            ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: 🖼️ Generate SVGs
        run: |
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE }}" --type github --athlete "${{ env.ATHLETE }}" --output assets/github.svg
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE_GRID }}" --type grid --athlete "${{ env.ATHLETE }}" --output assets/grid.svg --min-distance ${{ env.MIN_GRID_DISTANCE }}

#      - name: 📝 Update README (optional)
#        run: |
#          python scripts/readme.py

      - name: 💾 Commit and push new data
        run: |
          git config user.name "${{ env.GITHUB_NAME }}"
          git config user.email "${{ env.GITHUB_EMAIL }}"
          git add activities.json gpx/ assets/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update running data from Strava"
            git push
          else
            echo "No changes to commit."
          fi
