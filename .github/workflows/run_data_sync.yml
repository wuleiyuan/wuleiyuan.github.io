name: Sync Running Data from Keep

on:
  # 每天 UTC 00:00 自动运行（北京时间 08:00）
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUN_TYPE: keep
      ATHLETE: WuLeiYuan
      TITLE: WuLeiYuan Running
      MIN_GRID_DISTANCE: 10
      TITLE_GRID: Over 10km Runs
      GITHUB_NAME: wuleiyuan
      GITHUB_EMAIL: smile_wly@163.com
      KEEP_PHONE_NUMBER: ${{ secrets.KEEP_PHONE_NUMBER }}
      KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔁 Sync data from Keep
        run: |
          echo "=== Running Keep sync ==="
          python -u scripts/keep_sync.py \
            "${{ secrets.KEEP_PHONE_NUMBER }}" \
            "${{ secrets.KEEP_PASSWORD }}" \
            2>&1 || true

      - name: 💾 Commit DB changes
        run: |
          git config user.name "${{ env.GITHUB_NAME }}"
          git config user.email "${{ env.GITHUB_EMAIL }}"
          git add scripts/data.db
          if git diff --staged --quiet; then
            echo "DB unchanged, skipping commit"
          else
            git commit -m "chore: update running data to DB"
            git push
          fi

      - name: 📄 Generate activities.json from DB
        run: |
          echo "=== Generating activities.json from DB ==="
          python3 -c "
          import sqlite3
          import json
          from datetime import timedelta

          conn = sqlite3.connect('scripts/data.db')
          cursor = conn.cursor()

          cursor.execute('''
              SELECT run_id, name, distance, moving_time, type, 
                     start_date, start_date_local, location_country, summary_polyline,
                     average_heartrate, average_speed
              FROM activities 
              WHERE distance > 2000 AND type = 'Run'
              ORDER BY start_date_local ASC
          ''')

          columns = ['run_id', 'name', 'distance', 'moving_time', 'type',
                     'start_date', 'start_date_local', 'location_country', 'summary_polyline',
                     'average_heartrate', 'average_speed']

          activities = []
          for row in cursor.fetchall():
              activity = {}
              for i, col in enumerate(columns):
                  val = row[i]
                  if isinstance(val, timedelta):
                      val = str(val).split('.')[0]
                  elif isinstance(val, float):
                      if val != val:
                          val = None
                  activity[col] = val
              activities.append(activity)

          conn.close()

          activity_list = activities[::-1]
          json_path = 'src/static/activities.json'
          with open(json_path, 'w') as f:
              json.dump(activity_list, f, ensure_ascii=False)
          print(f'Generated {len(activity_list)} activities to JSON')
          print(f'Latest: {activity_list[0][\"start_date_local\"] if activity_list else \"None\"}')
          "

      - name: 🖼️ Generate SVGs
        run: |
          echo "=== Generating SVGs ===" 
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE }}" --type github --athlete "${{ env.ATHLETE }}" --output assets/github.svg 2>&1 || true
          python scripts/gen_svg.py --from-db --title "${{ env.TITLE_GRID }}" --type grid --athlete "${{ env.ATHLETE }}" --output assets/grid.svg --min-distance ${{ env.MIN_GRID_DISTANCE }} 2>&1 || true

      - name: 💾 Commit and push (safe mode)
        run: |
          git config user.name "${{ env.GITHUB_NAME }}"
          git config user.email "${{ env.GITHUB_EMAIL }}"
          git add src/static/activities.json scripts/data.db 2>/dev/null || true
          git add assets/*.svg 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected. Nothing to commit."
          else
            git commit -m "chore: update running data from Keep"
            git push
            echo "✅ Successfully pushed new running data."
          fi
